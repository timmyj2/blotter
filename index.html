<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blotter · Tim's tool-belt</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Dump scraps, tie them to a project, and see what is due. Saved in this browser. No Grok on this page.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3efe6;--sheet:#faf8f4;--ink:#1c1915;--muted:#6e675e;--line:#e3dcd0;--clay:#8c4a2f;
  --sans:"Instrument Sans",system-ui,sans-serif;--serif:"Newsreader",Palatino,serif;
}
html[data-theme="dark"]{
  --paper:#161310;--sheet:#221e19;--ink:#f3efe6;--muted:#b7aea2;--line:#3c342c;--clay:#e0a07e;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.app{display:flex;min-height:100vh;flex-direction:column}
aside{background:var(--sheet);border-bottom:1px solid var(--line);padding:16px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.6rem}
.mark i{display:grid;width:34px;height:34px;place-items:center;border-radius:50%;background:var(--ink);color:var(--paper);font-style:italic}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
nav button,nav a.navbtn{min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);padding:0 10px;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--paper)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags p{width:100%;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tags button{min-height:40px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:0 12px}
.tags button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.read{border:0;background:none;text-align:left;font-weight:600;width:100%;min-height:44px}
main{flex:1;padding:22px 16px 48px}
.wrap{max-width:40rem;margin:0 auto}
.kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,6vw,3rem);line-height:1.05;margin:6px 0 10px}
.sub{color:var(--muted);max-width:38ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field,select.field,textarea.field{width:100%;min-height:44px;border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:10px 12px}
textarea.field{min-height:7rem;resize:vertical}
.btn{min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);padding:0 14px}
.btn.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.clay{background:var(--clay);color:#faf8f4;border-color:var(--clay)}
.late{color:var(--clay)}
.card.done{opacity:.6}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.note{display:flex;gap:8px}
.note .body{flex:1;min-width:0}
.note h2{font-size:1rem;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:10px 14px;color:var(--muted);font-size:.9rem;margin-top:4px}
.meta button{border:0;background:none;color:inherit;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.check{width:44px;display:grid;place-items:center}
.panel{margin-top:16px}
.month{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.dow{text-align:center;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day{min-height:52px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.day.off{color:color-mix(in srgb,var(--muted) 45%,transparent)}
.day.on{background:var(--ink);color:var(--paper)}
.day.today:not(.on){box-shadow:inset 0 0 0 1px var(--clay)}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink);font-style:normal}
.day.on .dots i{background:var(--paper)}
.dots i.late{background:var(--clay)}
.week{margin-top:22px;border-top:1px solid var(--line)}
.week li{list-style:none;border-bottom:1px solid var(--line);padding:10px 0}
.week button.link,.scraplink{border:0;background:none;text-align:left;min-height:44px;display:block;width:100%}
.muted{color:var(--muted)}
.top{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:8px;padding-right:84px}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-right:auto;color:var(--muted);font-size:.85rem}
.who a{text-decoration:underline;text-underline-offset:3px}
#buddy{position:fixed;top:12px;right:12px;z-index:40;width:74px;height:74px;pointer-events:none;transform-origin:50% 80%;filter:drop-shadow(0 8px 14px rgba(28,25,21,.16))}
#buddy .body{fill:#1c1915}
#buddy .cheek{fill:#8c4a2f}
#buddy .white{fill:#faf8f4}
#buddy .pupil{fill:#1c1915}
#buddy .mouth{fill:none;stroke:#c4896a;stroke-width:2.4;stroke-linecap:round}
html[data-theme="dark"] #buddy .body{fill:#f3efe6}
html[data-theme="dark"] #buddy .white{fill:#1c1915}
html[data-theme="dark"] #buddy .pupil{fill:#f3efe6}
html[data-theme="dark"] #buddy .cheek{fill:#e0a07e}
html[data-theme="dark"] #buddy .mouth{stroke:#e0a07e}
.seg{display:flex;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:3px}
.seg button{min-height:36px;border:0;border-radius:999px;background:transparent;color:var(--muted);padding:0 12px}
.seg button.on{background:var(--ink);color:var(--paper)}
.empty{color:var(--muted);margin-top:16px}
#drop{position:fixed;inset:12px;z-index:30;display:grid;place-items:center;border:2px dashed var(--clay);border-radius:20px;background:color-mix(in srgb,var(--paper) 90%,transparent);font-family:var(--serif);font-size:clamp(1.4rem,4vw,2rem);text-align:center;padding:24px;pointer-events:none}
#drop[hidden]{display:none}
.file{position:relative}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media(min-width:800px){
  .app{flex-direction:row}
  aside{width:250px;border-bottom:0;border-right:1px solid var(--line);padding:22px 14px}
  nav{flex-direction:column}
  .tags{flex-direction:column;flex-wrap:nowrap;margin-top:22px}
  .tags p{padding:0 12px 6px}
  .tags button{border:0;border-radius:12px;text-align:left}
  .tags button.on{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
  main{padding:28px}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <a class="mark" href="/"><i>B</i> Blotter</a>
    </div>
    <nav id="nav"></nav>
    <div class="tags" id="tags"></div>
  </aside>
  <main>
    <div class="top">
      <p id="who" class="who"></p>
      <div class="seg" id="theme">
        <button type="button" data-theme="light">Light</button>
        <button type="button" data-theme="dark">Dark</button>
      </div>
    </div>
    <p id="note-line" class="sub" hidden style="max-width:40rem;margin:0 auto"></p>
    <div class="wrap" id="view"></div>
  </main>
</div>
<div id="drop" hidden>Drop a markdown or text file</div>
<div id="buddy" aria-hidden="true">
  <svg viewBox="0 0 80 84" width="74" height="78">
    <path class="body" d="M40 6c16 1 28 10 29 24 1 10-3 16-2 24 1 9-6 18-16 22-6 2-8 6-11 8-3-2-6-6-12-8-11-4-18-13-17-23-1-8-4-14-2-24C11 16 24 5 40 6z"/>
    <ellipse class="cheek" cx="58" cy="40" rx="6" ry="4"/>
    <g transform="translate(30 34)">
      <circle class="white" r="8"/>
      <circle class="pupil" r="3.2" cx="0" cy="0"/>
    </g>
    <g transform="translate(50 34)">
      <circle class="white" r="8"/>
      <circle class="pupil" r="3.2" cx="0" cy="0"/>
    </g>
    <path class="mouth" d="M32 50c4 5 12 5 16 0"/>
  </svg>
</div>
<script>
const KEY = "return-site-v1";
const THEME = "return-site-theme";
const blank = () => ({ scraps: [], threads: [], projects: [] });
let db = load();
let view = "now";
let query = "";
let projectFilter = "";
let threadId = "";
let selected = new Set();
let armed = "";
let openScrap = "";
let notice = "";
let account = null;
let offerBring = false;
let saveTimer = 0;
let month = startOfMonth(new Date());
let picked = stamp(new Date());

function normalize(raw) {
  if (!raw || !Array.isArray(raw.scraps)) return blank();
  raw.threads ||= [];
  raw.projects ||= [];
  for (const scrap of raw.scraps) {
    scrap.targetDate ||= null;
    scrap.done = !!scrap.done;
  }
  for (const thread of raw.threads) thread.done = !!thread.done;
  return { scraps: raw.scraps, threads: raw.threads, projects: raw.projects };
}
function load() {
  try {
    return normalize(JSON.parse(localStorage.getItem(KEY) || ""));
  } catch {
    return blank();
  }
}
function save() {
  if (account) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { void pushDesk(); }, 400);
    return;
  }
  localStorage.setItem(KEY, JSON.stringify(db));
}
async function pushDesk() {
  if (!account) return;
  const res = await fetch("/api/desk", {
    method: "PUT",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(db),
  });
  if (!res.ok) {
    notice = "Could not save to this account.";
    render();
  }
}
function localHasNotes() {
  const local = load();
  return local.scraps.length + local.threads.length + local.projects.length > 0;
}
function paintAccount() {
  const slot = document.getElementById("who");
  if (!slot) return;
  slot.replaceChildren();
  if (!account) return;
  const email = document.createElement("span");
  email.textContent = account.email;
  slot.append(email);
  if (offerBring) {
    const bring = document.createElement("button");
    bring.type = "button";
    bring.className = "btn";
    bring.textContent = "Bring notes from this browser";
    bring.onclick = () => { void bringLocal(); };
    slot.append(bring);
  }
  const out = document.createElement("a");
  out.href = account.logout;
  out.textContent = "Sign out";
  slot.append(out);
}
async function bringLocal() {
  db = load();
  offerBring = false;
  await pushDesk();
  localStorage.removeItem(KEY);
  notice = "Those notes are on this account now.";
  render();
}
function uid() { return crypto.randomUUID(); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => {
    if (c === "&") return "&" + "amp;";
    if (c === "<") return "&" + "lt;";
    if (c === ">") return "&" + "gt;";
    if (c === '"') return "&" + "quot;";
    return "&" + "#39;";
  });
}
function stamp(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parseStamp(s) {
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function addMonths(d, n) { return new Date(d.getFullYear(), d.getMonth()+n, 1); }
function today() { return stamp(new Date()); }
function addDays(day, n) {
  const d = parseStamp(day);
  d.setDate(d.getDate() + n);
  return stamp(d);
}
function looseNotes() {
  return db.scraps.filter((s) => !s.threadId && !s.done && !s.projectId && !s.targetDate);
}
function undatedNotes() {
  return db.scraps.filter((s) => !s.threadId && !s.done && s.projectId && !s.targetDate);
}
function dueOn(day) {
  const items = [];
  for (const thread of db.threads) {
    if (thread.done || thread.targetDate !== day) continue;
    items.push({ kind: "thread", id: thread.id, title: thread.title, projectId: thread.projectId, next: thread.next || "" });
  }
  for (const scrap of db.scraps) {
    if (scrap.done || scrap.threadId || scrap.targetDate !== day) continue;
    items.push({ kind: "scrap", id: scrap.id, title: scrap.text, projectId: scrap.projectId, next: "" });
  }
  return items;
}
function markDone(kind, id, done) {
  if (kind === "thread") {
    const thread = db.threads.find((item) => item.id === id);
    if (thread) thread.done = done;
  } else {
    const scrap = db.scraps.find((item) => item.id === id);
    if (scrap) scrap.done = done;
  }
  save();
  render();
}
function projectName(id) { return db.projects.find((p) => p.id === id)?.name || ""; }

function setTheme(name) {
  document.documentElement.dataset.theme = name;
  localStorage.setItem(THEME, name);
  document.querySelectorAll("#theme button").forEach((b) => b.classList.toggle("on", b.dataset.theme === name));
}
document.getElementById("theme").onclick = (e) => {
  const name = e.target.dataset.theme;
  if (name) setTheme(name);
};
setTheme(localStorage.getItem(THEME) === "dark" ? "dark" : "light");

const buddy = document.getElementById("buddy");
const pupils = buddy.querySelectorAll(".pupil");
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  addEventListener("pointermove", (e) => {
    const box = buddy.getBoundingClientRect();
    const dx = e.clientX - (box.left + box.width / 2);
    const dy = e.clientY - (box.top + box.height * 0.42);
    const ang = Math.atan2(dy, dx);
    const reach = Math.min(3.1, Math.hypot(dx, dy) / 80);
    const x = (Math.cos(ang) * reach).toFixed(2);
    const y = (Math.sin(ang) * reach).toFixed(2);
    pupils.forEach((pupil) => {
      pupil.setAttribute("cx", x);
      pupil.setAttribute("cy", y);
    });
    const tilt = Math.max(-8, Math.min(8, dx / 60));
    buddy.style.transform = `rotate(${tilt}deg)`;
  });
}

function go(next, extra) {
  view = next;
  if (extra?.threadId) threadId = extra.threadId;
  if (extra?.projectId !== undefined) projectFilter = extra.projectId;
  if (next !== "loose" && next !== "nodate") selected.clear();
  render();
}

function renderNav() {
  const items = [["now","Now"],["dump","Dump"],["loose","Loose"],["nodate","No date"],["calendar","Calendar"]];
  document.getElementById("nav").innerHTML = items.map(([id,label]) => {
    const count = id === "loose" ? looseNotes().length : id === "nodate" ? undatedNotes().length : 0;
    return `<button type="button" data-view="${id}" class="${view===id?"on":""}">${label}${count?` ${count}`:""}</button>`;
  }).join("");
  document.getElementById("nav").onclick = (e) => {
    const id = e.target.dataset.view;
    if (id) go(id);
  };
  const tags = document.getElementById("tags");
  tags.innerHTML = `<p>Tags</p>` + (db.projects.length ? db.projects.map((p) =>
    `<button type="button" data-project="${esc(p.id)}" class="${view==="project"&&projectFilter===p.id?"on":""}">#${esc(p.name)}</button>`
  ).join("") : `<button type="button" disabled>None yet</button>`);
  tags.onclick = (e) => {
    const id = e.target.dataset.project;
    if (id) go("project", { projectId: id });
  };
}

function render() {
  renderNav();
  const root = document.getElementById("view");
  if (view === "now") root.innerHTML = nowView();
  else if (view === "dump") root.innerHTML = dumpView();
  else if (view === "loose") root.innerHTML = placeView("loose");
  else if (view === "nodate") root.innerHTML = placeView("nodate");
  else if (view === "calendar") root.innerHTML = calendarView();
  else if (view === "thread") root.innerHTML = threadView();
  else if (view === "project") root.innerHTML = projectView();
  const line = document.getElementById("note-line");
  if (line) {
    line.hidden = !notice;
    line.textContent = notice;
  }
  paintAccount();
  bind();
}

function dumpView() {
  const recent = db.scraps.slice(0, 5);
  return `<p class="kicker">Dump</p><h1>Put it down.</h1>
    <p class="sub">One scrap. No project, no date. Or drop a .md or .txt file.</p>
    <form id="dump" class="stack">
      <textarea class="field" name="text" aria-label="Scrap" placeholder="What’s on your mind" required></textarea>
      <div class="row">
        <button class="btn ink" type="submit">Keep it</button>
        <label class="btn file">Open a file<input id="file" type="file" accept=".md,.markdown,.txt,.text,text/markdown,text/plain" multiple></label>
      </div>
    </form>
    ${recent.length ? `<div class="stack">${recent.map((s) => `<article class="card"><p>${esc(s.text)}</p></article>`).join("")}</div>` : `<p class="empty">Nothing here yet.</p>`}`;
}

function clip(text, id) {
  const open = openScrap === id;
  const shown = !open && text.length > 90 ? text.slice(0, 72).trim() + "…" : text;
  return `<button type="button" class="read" data-read="${esc(id)}">${esc(shown)}</button>`;
}
function taskCard(item, late) {
  const tag = item.projectId ? "#" + projectName(item.projectId) : "";
  const open = item.kind === "thread" ? `<button type="button" data-thread="${esc(item.id)}">Open</button>` : "";
  return `<article class="card${late ? " late" : ""}">
    <h2>${clip(item.title, item.kind + ":" + item.id)}</h2>
    ${item.next ? `<p class="muted">${esc(item.next)}</p>` : ""}
    <div class="meta">${item.day ? `<span>${esc(item.day)}</span>` : ""}${tag ? `<span>${esc(tag)}</span>` : ""}${open}<button type="button" data-done="${item.kind}:${esc(item.id)}">Done</button></div>
  </article>`;
}

function nowView() {
  const start = today();
  const end = addDays(start, 6);
  const tasks = [];
  for (const thread of db.threads) {
    if (thread.done || !thread.targetDate) continue;
    tasks.push({ kind: "thread", id: thread.id, title: thread.title, projectId: thread.projectId, next: thread.next || "", day: thread.targetDate });
  }
  for (const scrap of db.scraps) {
    if (scrap.done || scrap.threadId || !scrap.targetDate) continue;
    tasks.push({ kind: "scrap", id: scrap.id, title: scrap.text, projectId: scrap.projectId, next: "", day: scrap.targetDate });
  }
  tasks.sort((a, b) => a.day.localeCompare(b.day));
  const overdue = tasks.filter((item) => item.day < start);
  const week = tasks.filter((item) => item.day >= start && item.day <= end);
  const q = query.trim().toLowerCase();
  const hits = q.length < 2 ? [] : [
    ...db.threads.filter((t) => !t.done && (t.title + " " + (t.next || "")).toLowerCase().includes(q)).map((t) => ({ kind: "thread", id: t.id, title: t.title, projectId: t.projectId, next: t.next || "", day: t.targetDate })),
    ...db.scraps.filter((s) => !s.done && !s.threadId && s.text.toLowerCase().includes(q)).map((s) => ({ kind: "scrap", id: s.id, title: s.text, projectId: s.projectId, next: "", day: s.targetDate })),
  ];
  const blocks = q.length >= 2
    ? `<h2 style="font-family:var(--serif);font-weight:500;margin-top:18px">Matches</h2><div class="stack">${hits.length ? hits.map((item) => taskCard(item, item.day && item.day < start)).join("") : `<p class="empty">Nothing matches.</p>`}</div>`
    : `${overdue.length ? `<h2 class="late" style="font-family:var(--serif);font-weight:500;margin-top:18px">Overdue</h2><div class="stack">${overdue.map((item) => taskCard(item, true)).join("")}</div>` : ""}
       <h2 style="font-family:var(--serif);font-weight:500;margin-top:18px">This week</h2>
       <div class="stack">${week.length ? week.map((item) => taskCard(item, false)).join("") : `<p class="empty">Nothing in the next 7 days.</p>`}</div>`;
  return `<p class="kicker">Now</p><h1>What’s due</h1>
    <p class="sub">${looseNotes().length} loose · ${undatedNotes().length} in a project with no date.</p>
    <input id="find" class="field" style="margin-top:14px" placeholder="Search notes" value="${esc(query)}" aria-label="Search notes">
    ${blocks}`;
}

function placeView(mode) {
  const items = mode === "loose" ? looseNotes() : undatedNotes();
  const chosen = items.filter((s) => selected.has(s.id));
  const shared = chosen.length && chosen.every((s) => s.projectId === chosen[0].projectId) ? chosen[0].projectId || "" : "";
  const projectOptions = `<option value="">No project</option>` +
    db.projects.map((p) => `<option value="${esc(p.id)}" ${p.id===shared?"selected":""}>${esc(p.name)}</option>`).join("") +
    `<option value="__new__">New project</option>`;
  const threadOptions = db.threads.length ? `<select class="field" id="add-thread" aria-label="Add to an existing thread"><option value="">Add to a thread</option>${db.threads.filter((t)=>!t.done).map((t) => `<option value="${esc(t.id)}">${esc(t.title)}</option>`).join("")}</select>` : "";
  const form = chosen.length ? `<form id="tie" class="card panel">
      <p class="muted">${chosen.length === 1 ? "Give it a project, a date, or both." : `Tie ${chosen.length} scraps.`}</p>
      ${chosen.length >= 2 ? `<input class="field" name="title" aria-label="Thread title" placeholder="Name the thread" required style="margin-top:10px">` : ""}
      <div class="stack">
        <select class="field" name="project" aria-label="Project">${projectOptions}</select>
        <input class="field" name="projectName" aria-label="New project name" placeholder="Name the project" hidden>
        <input class="field" name="date" type="date" aria-label="Target date">
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn ink" type="submit">${chosen.length === 1 ? "Place" : "Tie"}</button>
        ${threadOptions}
        <button class="btn" type="button" id="clear">Clear</button>
      </div>
    </form>` : "";
  const list = items.length ? items.map((s) => {
    const title = openScrap === s.id ? s.text : (s.text.length > 72 ? s.text.slice(0, 56).trim() + "…" : s.text);
    const tag = s.projectId ? `#${projectName(s.projectId)}` : "";
    return `<article class="card note">
      <label class="check"><input type="checkbox" data-id="${esc(s.id)}" ${selected.has(s.id)?"checked":""} aria-label="Select scrap"></label>
      <div class="body">
        <h2><button type="button" class="read" data-read="${esc(s.id)}">${esc(title)}</button></h2>
        <div class="meta"><span>${esc(when(s.createdAt))}</span>${tag?`<span>${esc(tag)}</span>`:""}<button type="button" data-remove="${esc(s.id)}">${armed===s.id?"Remove it":"Remove"}</button></div>
      </div>
    </article>`;
  }).join("") : `<p class="empty">${mode==="loose" ? "Nothing loose. Dump first." : "Every project note has a date, or there are none yet."}</p>`;
  const head = mode === "loose"
    ? `<p class="kicker">Loose</p><h1>Still loose</h1><p class="sub">No project and no date. Place one, or tie two.</p>`
    : `<p class="kicker">No date</p><h1>In a project, no day</h1><p class="sub">These are the ones that disappear. Give them a date.</p>`;
  return `${head}${form}<div class="stack">${list}</div>`;
}

function calendarView() {
  const names = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const start = new Date(month);
  const lead = (start.getDay() + 6) % 7;
  start.setDate(1 - lead);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const day = new Date(start);
    day.setDate(start.getDate() + i);
    const key = stamp(day);
    const due = dueOn(key);
    const late = key < today();
    const dots = due.slice(0, 3).map(() => `<i class="${late?"late":""}"></i>`).join("");
    cells.push(`<button type="button" class="day${day.getMonth()!==month.getMonth()?" off":""}${key===picked?" on":""}${key===stamp(new Date())?" today":""}" data-day="${key}"><span>${day.getDate()}</span><span class="dots">${dots}</span></button>`);
  }
  const weekStart = parseStamp(picked);
  weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7));
  const rows = [];
  let count = 0;
  for (let i = 0; i < 7; i++) {
    const day = new Date(weekStart);
    day.setDate(weekStart.getDate() + i);
    const key = stamp(day);
    const due = dueOn(key);
    count += due.length;
    const body = due.length ? due.map((item) => {
      const label = item.title.length > 80 ? item.title.slice(0, 64).trim() + "…" : item.title;
      const open = item.kind === "thread" ? ` data-thread="${esc(item.id)}"` : "";
      return `<div class="row"><button type="button" class="scraplink"${open}>${esc(label)}</button><button class="btn" type="button" data-done="${item.kind}:${esc(item.id)}">Done</button></div>`;
    }).join("") : `<p class="muted">—</p>`;
    rows.push(`<li><strong>${day.toLocaleDateString(undefined,{weekday:"short"})} ${day.getDate()}</strong>${body}</li>`);
  }
  const end = new Date(weekStart); end.setDate(weekStart.getDate()+6);
  return `<div class="month"><div><p class="kicker">Calendar</p><h1>${month.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h1></div>
    <div class="row">
      <button class="btn" type="button" id="prev">Prev</button>
      <button class="btn" type="button" id="today">Today</button>
      <button class="btn" type="button" id="next">Next</button>
    </div></div>
    <p class="sub">A dot is a date. Done items stay off the month.</p>
    <div class="grid">${names.map((n)=>`<div class="dow">${n}</div>`).join("")}${cells.join("")}</div>
    <h2 style="font-family:var(--serif);font-weight:500;font-size:1.6rem;margin-top:22px">${weekStart.toLocaleDateString(undefined,{month:"short",day:"numeric"})} – ${end.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</h2>
    <p class="muted">${count?`${count} due`:"Nothing dated"}</p>
    <ul class="week">${rows.join("")}</ul>`;
}

function threadView() {
  const thread = db.threads.find((t) => t.id === threadId);
  if (!thread) return `<p class="empty">That thread is gone.</p><button class="btn" type="button" data-view="loose">Back to loose</button>`;
  const scraps = db.scraps.filter((s) => s.threadId === thread.id);
  const opts = `<option value="">No project</option>` + db.projects.map((p) => `<option value="${esc(p.id)}" ${p.id===thread.projectId?"selected":""}>${esc(p.name)}</option>`).join("");
  return `<button class="btn" type="button" id="back-cal">Calendar</button>
    <p class="kicker" style="margin-top:14px">Thread</p>
    <h1>${esc(thread.title)}</h1>
    <form id="thread-edit" class="stack">
      <select class="field" name="project" aria-label="Project">${opts}</select>
      <input class="field" name="date" type="date" aria-label="Target date" value="${esc(thread.targetDate||"")}">
      <input class="field" name="next" aria-label="Next move" placeholder="Next move" value="${esc(thread.next||"")}">
      <div class="row"><button class="btn ink" type="submit">Save</button><button class="btn" type="button" id="mark-thread">${thread.done?"Bring back":"Done"}</button><button class="btn" type="button" id="untie">Untie all</button></div>
    </form>
    <div class="stack">${scraps.map((s)=>`<article class="card"><p>${esc(s.text)}</p></article>`).join("")}</div>`;
}

function projectView() {
  const project = db.projects.find((p) => p.id === projectFilter);
  if (!project) return `<p class="empty">No such project.</p>`;
  const threads = db.threads.filter((t) => t.projectId === project.id && !t.done);
  const finishedThreads = db.threads.filter((t) => t.projectId === project.id && t.done);
  const pinned = db.scraps.filter((s) => s.projectId === project.id && !s.threadId && !s.done);
  const finished = db.scraps.filter((s) => s.projectId === project.id && !s.threadId && s.done);
  return `<p class="kicker">Project</p><h1>${esc(project.name)}</h1>
    <div class="stack">${threads.map((t)=>`<button type="button" class="card scraplink" data-thread="${esc(t.id)}">${esc(t.title)}${t.targetDate?` · ${esc(t.targetDate)}`:""}</button>`).join("")}
    ${pinned.map((s)=>`<article class="card"><p>${esc(s.text)}</p>${s.targetDate?`<p class="muted">${esc(s.targetDate)}</p>`:""}</article>`).join("")}
    ${!threads.length && !pinned.length ? `<p class="empty">Nothing open in this project.</p>` : ""}</div>
    ${(finishedThreads.length || finished.length) ? `<h2 style="font-family:var(--serif);font-weight:500;margin-top:22px">Done</h2><div class="stack">${finishedThreads.map((t)=>`<article class="card done"><button type="button" class="scraplink" data-thread="${esc(t.id)}">${esc(t.title)}</button><button class="btn" type="button" data-undo="thread:${esc(t.id)}">Bring back</button></article>`).join("")}${finished.map((s)=>`<article class="card done"><p>${esc(s.text)}</p><button class="btn" type="button" data-undo="scrap:${esc(s.id)}">Bring back</button></article>`).join("")}</div>` : ""}`;
}

function when(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  return d.toLocaleString(undefined, { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
}

function resolveProject(selectValue, name) {
  if (selectValue !== "__new__") return selectValue || null;
  const trimmed = name.trim().slice(0, 60);
  if (!trimmed) return null;
  const existing = db.projects.find((p) => p.name.toLowerCase() === trimmed.toLowerCase());
  if (existing) return existing.id;
  const id = uid();
  db.projects.push({ id, name: trimmed, createdAt: new Date().toISOString() });
  return id;
}

function bind() {
  const dump = document.getElementById("dump");
  if (dump) dump.onsubmit = (e) => {
    e.preventDefault();
    const text = new FormData(dump).get("text").toString().trim();
    if (!text) return;
    db.scraps.unshift({ id: uid(), text, createdAt: new Date().toISOString(), threadId: null, projectId: null, targetDate: null, done: false });
    save();
    render();
  };
  const file = document.getElementById("file");
  if (file) file.onchange = () => {
    const picked = [...file.files];
    file.value = "";
    if (picked.length) void takeFiles(picked);
  };
  document.querySelectorAll("[data-id]").forEach((box) => {
    box.onchange = () => {
      if (box.checked) selected.add(box.dataset.id);
      else selected.delete(box.dataset.id);
      render();
    };
  });
  document.querySelectorAll("[data-remove]").forEach((btn) => {
    btn.onclick = () => {
      const id = btn.dataset.remove;
      if (armed !== id) { armed = id; render(); return; }
      db.scraps = db.scraps.filter((s) => s.id !== id);
      selected.delete(id);
      armed = "";
      save();
      render();
    };
  });
  const tie = document.getElementById("tie");
  if (tie) {
    const project = tie.project;
    const name = tie.projectName;
    project.onchange = () => { name.hidden = project.value !== "__new__"; if (!name.hidden) name.focus(); };
    tie.onsubmit = (e) => {
      e.preventDefault();
      const ids = [...selected].filter((id) => db.scraps.some((s) => s.id === id && !s.threadId && !s.done));
      const projectId = resolveProject(project.value, name.value || "");
      if (project.value === "__new__" && !projectId) return;
      const date = tie.date.value || null;
      if (ids.length === 1) {
        const current = db.scraps.find((s) => s.id === ids[0]);
        if (!date && (projectId || null) === (current?.projectId || null)) return;
        db.scraps = db.scraps.map((s) => s.id === ids[0] ? { ...s, projectId: projectId ?? s.projectId, targetDate: date } : s);
      } else if (ids.length >= 2) {
        const title = tie.title.value.trim().slice(0, 80);
        if (!title) return;
        const id = uid();
        db.threads.unshift({ id, title, why: "Tied by hand.", projectId, targetDate: date, scrapIds: ids, next: null, done: false, updatedAt: new Date().toISOString() });
        db.scraps = db.scraps.map((s) => ids.includes(s.id) ? { ...s, threadId: id, projectId: projectId ?? s.projectId } : s);
        threadId = id;
        view = "thread";
      }
      selected.clear();
      save();
      render();
    };
    const clear = document.getElementById("clear");
    if (clear) clear.onclick = () => { selected.clear(); render(); };
    const add = document.getElementById("add-thread");
    if (add) add.onchange = () => {
      const tid = add.value;
      const thread = db.threads.find((t) => t.id === tid);
      if (!thread) return;
      const ids = [...selected].filter((id) => db.scraps.some((s) => s.id === id && !s.threadId && !s.done));
      thread.scrapIds.push(...ids);
      thread.updatedAt = new Date().toISOString();
      db.scraps = db.scraps.map((s) => ids.includes(s.id) ? { ...s, threadId: tid, projectId: thread.projectId ?? s.projectId } : s);
      selected.clear();
      save();
      threadId = tid;
      view = "thread";
      render();
    };
  }
  document.querySelectorAll("[data-day]").forEach((btn) => {
    btn.onclick = () => { picked = btn.dataset.day; month = startOfMonth(parseStamp(picked)); render(); };
  });
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  const today = document.getElementById("today");
  if (prev) prev.onclick = () => { month = addMonths(month, -1); render(); };
  if (next) next.onclick = () => { month = addMonths(month, 1); render(); };
  if (today) today.onclick = () => { picked = stamp(new Date()); month = startOfMonth(new Date()); render(); };
  document.querySelectorAll("[data-thread]").forEach((btn) => {
    btn.onclick = () => go("thread", { threadId: btn.dataset.thread });
  });
  const back = document.getElementById("back-cal");
  if (back) back.onclick = () => go("calendar");
  const edit = document.getElementById("thread-edit");
  if (edit) edit.onsubmit = (e) => {
    e.preventDefault();
    const thread = db.threads.find((t) => t.id === threadId);
    if (!thread) return;
    thread.projectId = edit.project.value || null;
    thread.targetDate = edit.date.value || null;
    thread.next = edit.next.value.trim().slice(0, 180) || null;
    thread.updatedAt = new Date().toISOString();
    db.scraps = db.scraps.map((s) => thread.scrapIds.includes(s.id) ? { ...s, projectId: thread.projectId } : s);
    save();
    render();
  };
  const untie = document.getElementById("untie");
  if (untie) untie.onclick = () => {
    db.scraps = db.scraps.map((s) => s.threadId === threadId ? { ...s, threadId: null } : s);
    db.threads = db.threads.filter((t) => t.id !== threadId);
    save();
    go("loose");
  };
  const mark = document.getElementById("mark-thread");
  if (mark) mark.onclick = () => {
    const thread = db.threads.find((t) => t.id === threadId);
    if (!thread) return;
    thread.done = !thread.done;
    save();
    go(thread.done ? "now" : "thread", { threadId });
  };
  document.querySelectorAll("[data-done]").forEach((btn) => {
    btn.onclick = () => {
      const [kind, id] = btn.dataset.done.split(":");
      markDone(kind, id, true);
    };
  });
  document.querySelectorAll("[data-undo]").forEach((btn) => {
    btn.onclick = () => {
      const [kind, id] = btn.dataset.undo.split(":");
      markDone(kind, id, false);
    };
  });
  const find = document.getElementById("find");
  if (find) find.oninput = () => {
    query = find.value;
    const start = find.selectionStart;
    render();
    const again = document.getElementById("find");
    if (!again) return;
    again.focus();
    again.setSelectionRange(start, start);
  };
  document.querySelectorAll("[data-read]").forEach((btn) => {
    btn.onclick = () => {
      openScrap = openScrap === btn.dataset.read ? "" : btn.dataset.read;
      render();
    };
  });
}

const textFile = /\.(md|markdown|txt|text)$/i;

function pieces(text) {
  const clean = text.replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").trim();
  if (!clean) return [];
  return clean.split(/\n(?=#{1,3} )/).map((part) => part.trim()).filter(Boolean);
}

async function takeFiles(files) {
  const skipped = [];
  const made = [];
  for (const file of files) {
    if (!textFile.test(file.name) || file.size > 400000) {
      skipped.push(file.name);
      continue;
    }
    made.push(...pieces(await file.text()).map((part) => part.slice(0, 12000)));
  }
  if (made.length) {
    const stamped = new Date().toISOString();
    for (const text of made.reverse()) {
      db.scraps.unshift({ id: uid(), text, createdAt: stamped, threadId: null, projectId: null, targetDate: null, done: false });
    }
    save();
    view = "loose";
    notice = `${made.length} note${made.length === 1 ? "" : "s"} added.`;
    if (skipped.length) notice += ` Skipped ${skipped.length}.`;
  } else {
    notice = "Only markdown and text files.";
  }
  render();
}

const veil = document.getElementById("drop");
let dragDepth = 0;
addEventListener("dragenter", (event) => {
  if (![...(event.dataTransfer?.types || [])].includes("Files")) return;
  event.preventDefault();
  dragDepth += 1;
  veil.hidden = false;
});
addEventListener("dragover", (event) => {
  if (![...(event.dataTransfer?.types || [])].includes("Files")) return;
  event.preventDefault();
});
addEventListener("dragleave", () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) veil.hidden = true;
});
addEventListener("drop", (event) => {
  if (![...(event.dataTransfer?.types || [])].includes("Files")) return;
  event.preventDefault();
  dragDepth = 0;
  veil.hidden = true;
  const files = [...(event.dataTransfer?.files || [])];
  if (files.length) void takeFiles(files);
});

document.getElementById("view").innerHTML = `<p class="sub">Opening…</p>`;
start();

async function start() {
  try {
    const me = await fetch("/api/me");
    const info = me.ok ? await me.json() : null;
    if (info?.email) {
      const deskRes = await fetch("/api/desk");
      if (deskRes.ok) {
        account = info;
        const remote = normalize(await deskRes.json());
        const remoteHas = remote.scraps.length + remote.threads.length + remote.projects.length > 0;
        if (remoteHas) db = remote;
        else {
          db = blank();
          offerBring = localHasNotes();
        }
        render();
        return;
      }
      if (deskRes.status !== 401) notice = "Signed in, but notes are not connected to the account yet.";
    }
  } catch {
    /* keep this browser's notes */
  }
  render();
}
